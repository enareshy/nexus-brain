name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned to commit SHAs and images to digests, so a moved tag cannot change what runs here.
# The jobs are independent, so a failure in one never hides the result of the other.
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Scan full history with gitleaks (values redacted in output)
        run: |
          status=0
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46 \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner \
            --report-format json --report-path /repo/gitleaks-report.json > gitleaks.log 2>&1 || status=$?
          # Annotations are readable without signing in. They name the rule, file and commit, never the value.
          if [ -s gitleaks-report.json ] && [ "$(jq length gitleaks-report.json)" -gt 0 ]; then
            findings=$(jq -r '.[] | "\(.RuleID) \(.File) \(.Commit[0:7])"' gitleaks-report.json | sort -u | paste -sd '~' | sed 's/~/%0A/g')
            echo "::error title=gitleaks findings::$findings"
          elif [ "$status" -ne 0 ]; then
            echo "::error title=gitleaks did not finish::$(tail -n 3 gitleaks.log | paste -sd '~' | sed 's/~/%0A/g')"
          fi
          exit "$status"

  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
        env:
          POSTGRES_USER: brain
          POSTGRES_PASSWORD: brain
          POSTGRES_DB: brain
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U brain"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://brain:brain@localhost:5432/brain
      DATABASE_APP_ROLE_URL: postgres://brain_app:brain_app@localhost:5432/brain
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create CI app role
        run: psql "$DATABASE_URL" -c "CREATE ROLE brain_app LOGIN PASSWORD 'brain_app';"
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:cov
      - name: Integration tests (RLS leak suite, API + mock MCP OAuth flow)
        run: pnpm test:int
      - run: pnpm eval
